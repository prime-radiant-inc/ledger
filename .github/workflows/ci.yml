name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ledger/go.mod
          cache-dependency-path: ledger/go.sum
      - name: go vet
        working-directory: ledger
        run: go vet ./...
      - name: go test
        working-directory: ledger
        run: go test ./...
